name: update-data

# 하루 3회(한국시간 09:07 · 13:07 · 18:07) ev.or.kr 에서 데이터를 다시 읽어 data.json / index.html 을 갱신합니다.
# 수동 실행: Actions 탭 > update-data > Run workflow
on:
  schedule:
    - cron: "7 0,4,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Scrape
        run: python scrape_ev.py
      - name: Upload debug files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: |
            debug.png
            debug.html.txt
          if-no-files-found: ignore
      - name: Commit if changed
        run: |
          git config user.name "madoo-bot"
          git config user.email "madoo-bot@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
